            <div class="form-group">
                <label for="senha_hash">Senha:</label>
                <input type="password" class="form-control" name="senha" id="senha_hash" placeholder="Digite sua nova senha">
            </div>
              <div class="form-group">
                <input type="hidden" class="form-control" name="nome" id="nome">
            </div>
            <div class="form-group">

                  <input type="hidden" class="form-control" name="cargos" id="cargos">

            </div>

            </div>
            <div class="form-group">
                <input type="hidden" class="form-control" name="doc" id="doc">
            </div>

            <button type="button" id="btn" class="btn btn-primary btn-block">Enviar</button>

<script>




           async function carregar_dados(){
        obj = await pegar_dados(id);
        preencher(obj);
    }
    const cargo = sessionStorage.getItem('cargo');
    const bemvindo = document.getElementById('bem-vindo');
    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const id = sessionStorage.getItem('id');
    const nome = sessionStorage.getItem('nome');
    if (!id || nome == null){
        window.location.href = '';
    }
    else{
        carregar_dados();
        bemvindo.textContent = `Seja bem-vindo ${cargo} ${nome}`;
    }



    async function pegar_dados(id){
                let requisicao = await fetch(`../../api/usuario.php?id=${id}` , {
                method: 'GET',
                headers:{
                    'Content-Type': 'application/json'
                }
            })
             const resposta = await requisicao.json();
             return resposta
    }

    function preencher(obj){
            document.getElementById('nome').value = obj.nome;
            document.getElementById('email').value = obj.email;
            // document.getElementById('senha_hash').value = obj.senha_hash;
            document.getElementById('data_nasc').value = obj.data_nasc;
            document.getElementById("cargos").value = obj.cargo;
            document.getElementById('status').value = obj.status; // Define o valor selecionado no select
            document.getElementById('doc').value = obj.doc;
    }
dormir = (tempo) => new Promise(res => setTimeout(res,tempo));
btn = document.getElementById("btn");
btn.addEventListener('click',enviar);
        async function enviar(){
            try {
            obj = {};
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha_hash = document.getElementById('senha_hash').value;
            if (senha_hash == ""){
                document.getElementById("resultado").innerHTML = "Preencha uma senha!";
                await dormir(1000);
                document.getElementById("resultado").innerHTML = "";
                return;
            }
            if (senha_hash.length < 8){
                document.getElementById("resultado").innerHTML = "A senha deve ter no mínimo <br> 8 caracteres!";
                await dormir(1200);
                document.getElementById("resultado").innerHTML = "";
                return;

            }
            const data_nasc = document.getElementById('data_nasc').value;
            var cargo = document.getElementById("cargos").value;
            const status = document.getElementById('status').value;
            const doc = document.getElementById('doc').value;
            let requisicao = await fetch(`../../api/usuario.php?id=${id}` , {
                method: 'PUT',
                headers:{
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({nome,email,senha_hash,data_nasc,cargo,status,doc})
            })
        const resposta = await requisicao.json(); 
        console.log("Resposta:", resposta); 
        resultado = document.getElementById('resultado')
        if(resposta.message) { 
            resultado.innerHTML = "Senha alterada com sucesso!!";
            dormir = (tempo) => new Promise(res => setTimeout(res,tempo));
            dormir(1000);
            window.location.href = 'login.html';
        }
  } 
            catch (err) {
                console.log("erro é:" + err);
                resultado.innerHTML = "Senha inválida!!";
                dormir(1000);
                resultado.innerHTML = "";
                return;

            }



}
