<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Veículo - PUCaronas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <style>
        .card {
            margin-top: 5vh;
            padding: 3rem;
            border-radius: 2rem;
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }
        body {
            background: linear-gradient(135deg, #8b0000 0%, #2b0000 100%);
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
        }

        .btn-primary {
            background-color: darkred;
            border: none;
            color: white;
            border-radius: 50px;
            font-weight: 600;
            padding: 12px;
            transition: all 0.3s;
        }
         
        .btn-primary:hover{
            background-color: #a00000;
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: darkred;">
  <a class="navbar-brand text-white" href="#">PUCaronas</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
      <li class="nav-item active">
        <a class="nav-link text-white" href="../caronas/logado_home.html">Home <span class="sr-only">(current)</span></a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="../caronas/caronas.html">Caronas</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="../usuario/login.html" onclick="sessionStorage.clear()">Sair</a>
      </li>
    </ul>
    <span id="bem-vindo" class="navbar-text ml-auto text-white"></span>
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card w-100" style="max-width: 500px;">
        <h3 class="text-center mb-4">Editar Veículo</h3>
        <form>
            <div class="form-group">
                <label for="modelo">Modelo:</label>
                <input type="text" class="form-control" id="modelo" name="modelo">
            </div>
            <div class="form-group">
                <label for="placa">Placa:</label>
                <input type="text" class="form-control" id="placa" name="placa" maxlength="7" placeholder="Ex: ABC1234 ou ABC1D23" style="text-transform:uppercase;">
            </div>
            <div class="form-group">
                <label for="n_assentos">Número de Assentos:</label>
                <input type="number" class="form-control" id="n_assentos" name="n_assentos">
            </div>
            <h1 id="resultado"></h1>
            <button type="button" class="btn btn-primary btn-block" id="btn">Salvar Alterações</button>
        </form>
    </div>
</div>
<script>
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const id_carro = urlParams.get('id');
document.addEventListener("DOMContentLoaded", async (event) => {
        const bemvindo = document.getElementById('bem-vindo');
        const nome = sessionStorage.getItem('nome');
        const cargo = sessionStorage.getItem('cargo');
        if (!nome || cargo !== 'motorista') {
            window.location.href = '../usuario/login.html';
        }
        if (id_carro) {
            const obj = await pegar_dados(id_carro);
            preencher(obj);
        }
        bemvindo.textContent = `Bem-vindo, ${cargo} ${nome}!`;
    });

    async function pegar_dados(id){
        let requisicao = await fetch(`../../api/carros.php?id=${id_carro}` , {
            method: 'GET',
            headers:{
                'Content-Type': 'application/json'
            }
        })
        const resposta = await requisicao.json();
        return resposta;
    }

    function preencher(obj){
        document.getElementById('modelo').value = obj.modelo;
        document.getElementById('placa').value = obj.placa;
        document.getElementById('n_assentos').value = obj.n_assentos;
    }


btn = document.getElementById("btn");
btn.addEventListener('click',enviar);
dormir = (tempo) => new Promise(res => setTimeout(res,tempo));

        function validarPlaca(placa) {
            const p = placa.toUpperCase().trim();
            return /^[A-Z]{3}\d{4}$/.test(p) || /^[A-Z]{3}\d[A-Z]\d{2}$/.test(p);
        }

        async function enviar(){
            try {
            obj = {};
            const id_motorista = sessionStorage.getItem('id');
            const modelo = document.getElementById('modelo').value;
            const placa = document.getElementById('placa').value.toUpperCase().trim();
            const n_assentos = document.getElementById('n_assentos').value;
            resultado = document.getElementById('resultado');

            if (!validarPlaca(placa)) {
                resultado.innerHTML = "Placa inválida!";
                await dormir(2000);
                resultado.innerHTML = "";
                return;
            }

            let requisicao = await fetch(`../../api/carros.php?id=${id_carro}` , {
                method: 'PUT',
                headers:{
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({id_motorista,modelo,placa,n_assentos})
            })
        const resposta = await requisicao.json(); 
        console.log("Resposta:", resposta); 
        resultado = document.getElementById('resultado');
        if (resposta.message = "veiculo ok"){
            resultado.innerHTML = "Veículo adicionado com sucesso";
            dormir(1000);
            window.location.href = 'meus_carros.html';
        }
        else {
            resultado.innerHTML = "Erro de dados, ajuste os dados.";
            dormir(1000);
            resultado.innerHTML = "";
        }
    }
     catch (err){
                console.log(err)
            }
        }

</script>
<script src="../timeout/session-timeout.js"></script>
</body>
</html>
