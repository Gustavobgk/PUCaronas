<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Carros - PUCaronas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <style>
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            margin: 1rem auto;
            transition: all 0.3s ease;
        }
        body {
            background: linear-gradient(135deg, #8b0000 0%, #2b0000 100%);
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }
        .btn-primary {
            background: rgba(139, 0, 0, 0.85);
            color: white;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: rgba(180, 0, 0, 0.95);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 0, 0, 0.35);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
        }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background-color: darkred;">
  <a class="navbar-brand text-white" href="#">PUCaronas</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
      <li class="nav-item active">
        <a class="nav-link text-white" href="../caronas/logado_home.html">Home</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="../caronas/caronas.html">Caronas</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="../usuario/login.html" onclick="sessionStorage.clear()">Sair</a>
      </li>
    </ul>
    <span id="bem-vindo" class="navbar-text ml-auto text-white"></span>
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card w-100" style="max-width: 500px;">
        <h3 class="text-center mb-4">Meus Carros</h3>
        <div class="text-center mb-3">
            <a href="criar_carro.html" class="btn btn-primary">Adicionar Novo Carro</a>
        </div>
        <div id="carros-lista" class="mb-3"></div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalDeletar" tabindex="-1" role="dialog" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content" style="border-radius:1rem;">
      <div class="modal-header" style="background-color:darkred;">
        <h5 class="modal-title text-white" id="modal-titulo">Excluir veículo</h5>
        <button type="button" class="close text-white" data-dismiss="modal">
          <span>&times;</span>
        </button>
      </div>
      <div class="modal-body text-center py-4">
        <p id="modal-mensagem" class="mb-0"></p>
      </div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const bemvindo = document.getElementById('bem-vindo');
        const nome = sessionStorage.getItem('nome');
        const cargo = sessionStorage.getItem('cargo');
        const status = sessionStorage.getItem('status');
        if (status === "espera") window.location.href = '../home.html';
        if (!nome || cargo !== 'motorista') window.location.href = '../usuario/login.html';
        else bemvindo.textContent = `Bem-vindo ${nome}`;
        receber();
    });

    async function receber() {
        try {
            const id_motorista = sessionStorage.getItem('id');
            const req = await fetch(`../../api/carros.php?id_motorista=${id_motorista}`, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
            const resposta = await req.json();
            const lista = document.getElementById('carros-lista');
            lista.innerHTML = "";
            if (!resposta.length) {
                lista.innerHTML = '<p class="text-center text-muted">Nenhum carro cadastrado.</p>';
                return;
            }
            resposta.forEach(carro => {
                lista.innerHTML += `
                    <div class="card mb-2">
                        <div class="card-body">
                            <h5 class="card-title mb-1">${carro.modelo}</h5>
                            <p class="mb-1">Placa: <b>${carro.placa}</b></p>
                            <span class="badge badge-primary">${carro.n_assentos} assentos</span>
                            <div class="mt-2 float-right">
                                <a href="editar_carro.html?id=${carro.id}" class="btn btn-outline-secondary btn-sm mr-2">Editar</a>
                                <button class="btn btn-outline-danger btn-sm" onclick="deletar(${carro.id})">Deletar</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        } catch (err) {
            console.log(err);
        }
    }

    let idParaDeletar = null;

    async function deletar(id) {
        idParaDeletar = id;
        const mensagem = document.getElementById('modal-mensagem');
        const footer   = document.getElementById('modal-footer');

        // verifica se está em uso
        const req = await fetch(`../../api/carros.php?id=${id}&check=true`, { method: 'DELETE' });
        const resposta = await req.json();

        if (resposta.message === 'em_uso') {
            mensagem.innerHTML = `<span class="text-danger font-weight-bold">Atenção!</span><br>
                Este veículo está vinculado a uma ou mais caronas e não pode ser excluído.`;
            footer.innerHTML = `<button type="button" class="btn btn-secondary" data-dismiss="modal">Fechar</button>`;
        } else {
            mensagem.innerHTML = 'Tem certeza que deseja excluir este veículo?';
            footer.innerHTML = `
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-danger" onclick="confirmarDeletar()">Excluir</button>
            `;
        }
        $('#modalDeletar').modal('show');
    }

    async function confirmarDeletar() {
        const req = await fetch(`../../api/carros.php?id=${idParaDeletar}`, { method: 'DELETE' });
        const resposta = await req.json();
        const mensagem = document.getElementById('modal-mensagem');
        const footer   = document.getElementById('modal-footer');

        if (resposta.message === 'del sucesso') {
            mensagem.innerHTML = 'Veículo excluído com sucesso!';
            footer.innerHTML = `<button type="button" class="btn btn-secondary" data-dismiss="modal">Fechar</button>`;
            receber();
        } else {
            mensagem.innerHTML = 'Erro ao excluir veículo.';
        }
    }
</script>

<script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
<script src="../timeout/session-timeout.js"></script>
</body>
</html>
