<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Carro - PUCaronas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" crossorigin="anonymous">
    <style>
        .card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            padding: 3rem;
            width: 100%;
            max-width: 400px;
            margin: 1rem auto;
            transition: all 0.3s ease;
        }



        body {
            background: linear-gradient(135deg, #8b0000 0%, #2b0000 100%);
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
        }



        .btn-primary {
            background: rgba(139, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            color: white;
            border-radius: 50px;
            border: 1px solid rgba(255,255,255,0.15);
            transition: all 0.3s ease;
        }



        .btn-primary:hover {
            background: rgba(180, 0, 0, 0.95);
            transform: translateY(-2px);

            box-shadow:
            0 8px 20px rgba(255, 0, 0, 0.35);

            border: 1px solid rgba(255,255,255,0.3);
        }



    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg" style="background-color: darkred;">
  <a class="navbar-brand text-white" href="#">PUCaronas</a>
  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
      <li class="nav-item active">
        <a class="nav-link text-white" href="../caronas/logado_home.html">Home <span class="sr-only">(current)</span></a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="../caronas/caronas.html">Caronas</a>
      </li>
      <li class="nav-item">
        <a class="nav-link text-white" href="../usuario/login.html" onclick="sessionStorage.clear()">Sair</a>
      </li>
    </ul>
    <span id="bem-vindo" class="navbar-text ml-auto text-white"></span>
  </div>
</nav>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card w-100" style="max-width: 500px;">
        <h3 class="text-center mb-4">Cadastrar Carro</h3>
        <form>
            <div class="form-group">
                <label for="modelo">Modelo:</label>
                <input type="text" class="form-control" id="modelo" name="modelo" placeholder="Ex: Renault Kwid" required>
            </div>
            <div class="form-group">
                <label for="placa">Placa:</label>
                <input type="text" class="form-control" id="placa" name="placa" minlength="7" maxlength="7" required placeholder="Ex: ABC1234 ou ABC1D23" style="text-transform:uppercase;">
            </div>
            <div class="form-group">
                <label for="n_assentos">Número de Assentos:</label>
                <input type="number" class="form-control" id="n_assentos" name="n_assentos">
            </div>
            <h1 id="resultado"></h1>
            <button type="button" class="btn btn-primary btn-block" id="btn">Cadastrar</button>
        </form>
    </div>
</div>
<script>
        document.addEventListener("DOMContentLoaded", (event) => {
    const bemvindo = document.getElementById('bem-vindo');
    const nome = sessionStorage.getItem('nome');
    const cargo = sessionStorage.getItem('cargo');
    if (!nome || cargo !== 'motorista') {
        window.location.href = '../usuario/login.html';
    }else{
       bemvindo.textContent = `Bem-vindo ${cargo} ${nome}`;
    }
});

btn = document.getElementById("btn");
btn.addEventListener('click',enviar);
dormir = (tempo) => new Promise(res => setTimeout(res,tempo));

        function validarPlaca(placa) {
            const p = placa.toUpperCase().trim();
            return /^[A-Z]{3}\d{4}$/.test(p) || /^[A-Z]{3}\d[A-Z]\d{2}$/.test(p);
        }
            const resultado = document.getElementById('resultado');

        async function enviar(){
            try {
            obj = {};
            const id_motorista = sessionStorage.getItem('id');
            const modelo = document.getElementById('modelo').value;
            const placa = document.getElementById('placa').value.toUpperCase().trim();
            const n_assentos = document.getElementById('n_assentos').value;

            if (!validarPlaca(placa)) {
                resultado.innerHTML = "Placa inválida!";
                await dormir(2000);
                resultado.innerHTML = "";
                return;
            }

            let requisicao = await fetch('../../api/carros.php' , {
                method: 'POST',
                headers:{
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({id_motorista,modelo,placa,n_assentos})
            })
        const resposta = await requisicao.json(); 
        console.log("Resposta:", resposta); 
        if (resposta.message === "veiculo ok"){
            resultado.innerHTML = "Veículo adicionado com sucesso";
            await dormir(1000);
            window.location.href = 'meus_carros.html';
        }
        else if (resposta.message === "placa") {
            resultado.innerHTML = "Erro: Placa já cadastrada.";
            await dormir(1000);
            window.location.href = '../caronas/logado_home.html'; // Redireciona para home_logado.html
        }
        else {
            resultado.innerHTML = "Erro de dados, ajuste os dados.";
            await dormir(1000);
            resultado.innerHTML = "";
        }
    }
     catch (err){
                console.log(err)
            }
        }
</script>
<script src="../timeout/session-timeout.js"></script>
</body>
</html>
