    <script>
const dormir = (ms) => new Promise(resolve => setTimeout(resolve, ms));
       document.addEventListener("DOMContentLoaded", (event) => {
    const nome = sessionStorage.getItem('nome');
    const cargo = sessionStorage.getItem('cargo');
    const status = sessionStorage.getItem('status');
    if (cargo !== 'passageiro' && cargo !== 'admin') {
        window.location.href = '../usuario/login.html';
    }
    receber();
});



 async function receber(){
            try {
            id_passageiro = sessionStorage.getItem('id');
            let requisicao = await fetch(`../../api/corridas.php?id_passageiro=${id_passageiro}` , {
                method: 'GET',
                headers:{
                    'Content-Type': 'application/json'
                }
            })
            
        const resposta = await requisicao.json(); 
        console.log("Resposta:", resposta);
        
        const lista = document.getElementById('corridas-lista');
        lista.innerHTML = ""; 
        let contador = 0;
        resposta.forEach(corrida => {

                const labels = {
        'pendente':     'Pendente',
        'em_andamento': 'Em andamento',
        'finalizada':   'Finalizada',
        'cancelada':    'Cancelada'
    };

    const ap = labels[corrida.status] || corrida.status;
    const botoes = corrida.status === 'finalizada' ? `
        <a href="#" class="btn btn-outline-warning btn-sm ml-2"  data-toggle="modal" onclick="abrirModal(${corrida.id_carona},${corrida.id_motorista})">Avaliar</a>
    ` : '';

            lista.innerHTML += `
                <div class="card mb-2">
                    <div class="card-body">
                        <h5 class="card-title mb-1" style = "position: relative;
  bottom: 2.5vh;
  font-size: 1.3vw;
  right: 2vw;">Carona : ${corrida.titulo}</h5>
                        <p class="mb-1">Origem: <b>${corrida.origem}</b></p>
                        <p class="mb-1">Destino: <b>${corrida.destino}</b></p>
                        <p class="mb-1">Motorista: <b>${corrida.nome_motorista}</b></p>
                        <span class="badge badge-primary">${ap} </span>
                        <div class="mt-4 d-flex justify-content-center align-items-center" id="btn-lista">
                     ${botoes}
                            </div>
                    </div>
                </div>
            `;
            contador +=1;

                       

        });





    } 
            catch (err) {
                console.log(err);
            }




}

async function atualizarStatus(id_carona,acao){
try{
    id_motorista = sessionStorage.getItem('id');
    let requisicao = await fetch(`../../api/corridas.php?id_carona=${id_carona}&id_motorista=${id_motorista}` , {
        method: 'POST',
        headers:{
            'Content-Type': 'application/json'
        },
        body : JSON.stringify({status: acao})
                })

                 const resposta = await requisicao.json(); 
        console.log("Resposta:", resposta);
        lista = document.getElementById('corridas-lista');
        lista.innerHTML = "";
        receber();        
}
catch(err){
    console.log("erro é:" + err);
    alert(err);
}
}

    //                     <a href="#" class="ml-2 mr-2 btn btn-outline-info" onclick="atualizarStatus(${corrida.id_carona},'finalizada')" id="finalizar">Finalizar</a>

let id_carona_atual;
let id_motorista_atual;
    async function abrirModal(id_carona,id_motorista){
        id_carona_atual = id_carona;
        id_motorista_atual = id_motorista;
        const id_passageiro=sessionStorage.getItem('id');
        const req = await fetch(`../../api/usuario.php?id=${id_motorista}`);
        const motorista = await req.json();
        console.log(motorista);
        console.log(id_motorista);
        const nome_motorista = document.getElementById('id_user');
        nome_motorista.innerHTML = `Motorista: ${motorista.nome}` 
    $('#modalAvaliacao').modal('show');
    }

    async function enviarAvaliacao() {
    const id_motorista = id_motorista_atual;
    console.log(id_motorista_atual);
    const id_passageiro = sessionStorage.getItem('id');
    notaSelecionada = document.getElementById('nota').value;
    const nota = notaSelecionada; // da lógica de estrelas
     console.log("id_passageiro:", id_passageiro);
    console.log("id_motorista:", id_motorista);
    console.log("nota:", nota);

    if (!nota) { 
        document.getElementById('resultado').innerHTML="Digite uma nota!!";
        await dormir(1000);
         document.getElementById('resultado').innerHTML="";     
  
        return;
    }
    const req_check = await fetch(`../../api/avaliacoes.php?checagem_passageiro_motorista=1&id_passageiro=${id_passageiro}&id_motorista=${id_motorista}`);
    const resposta2 = await req_check.json();
    console.log(resposta2.message);
    console.log("TEST");
    if (resposta2.length > 0) {
    document.getElementById('resultado').innerHTML = 'Você já avaliou este motorista!';
    await dormir(1500);
    document.getElementById('resultado').innerHTML = '';
            document.getElementById('nota').value = ''
            $('#modalAvaliacao').modal('hide');
    return; 
}
    const req = await fetch(
        `../../api/avaliacoes.php?id_passageiro=${id_passageiro}&id_motorista=${id_motorista}`,
        {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nota, tipo: 'passageiro_para_motorista' })
        }
    );
    const resposta = await req.json();
    console.log(resposta.message);
    if (resposta.message) {
        document.getElementById('nota').value = ''
        document.getElementById('resultado').innerHTML = 'Avaliação enviada!';
        await dormir(1000);
        document.getElementById('resultado').innerHTML = '';   
        document.getElementById('id_user').innerHTML = '';
        $('#modalAvaliacao').modal('hide');
        receber();
    }
}
