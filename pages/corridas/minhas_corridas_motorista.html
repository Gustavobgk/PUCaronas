<style>
            .card {
            margin-top: 5vh;
            padding: 3rem;
            border-radius: 2rem;
            background: rgba(255, 255, 255, 0.85) !important;
            backdrop-filter: blur(15px) !important;
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3) !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            }


            body {
            background: linear-gradient(135deg, #8b0000 0%, #2b0000 100%);
            background-attachment: fixed;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            margin: 0;
            }

            .btn-outline-warning {
            color: #ffc107;
            border: 2px solid #ffc107;
            border-radius: 14px;
            padding: 0.7rem 1.4rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: rgba(255, 193, 7, 0.08);
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.15);
            }

            .btn-outline-warning:hover {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: white;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.35);
            border-color: transparent;
            }

            .btn-outline-warning:active {
            transform: scale(0.96);
            }

            .btn-outline-warning:focus {
            box-shadow: 0 0 0 0.25rem rgba(255, 193, 7, 0.35);
            }

            .btn-primary{
            background: darkred;
            color: white;
            border-radius: 50px;
            font-weight: 600;
            padding: 0.8rem;
            transition: 0.3s;
            border: none;
            }

            .btn-primary:hover{
            background: linear-gradient(135deg, #8b0000, #ce0a00);
            color: white;
            transform: translateY(-2px) scale(1.03);
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.35);
            border-color: transparent;  
            }

            .modal-content {
            border-radius: 1.5rem;
            border: none;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            }

            .modal-header {
            background: linear-gradient(135deg, #8b0000, #ce0a00);
            color: white;
            border-radius: 1.5rem 1.5rem 0 0;
            border: none;
            }

            .modal-header .close {
            color: white;
            opacity: 0.8;
            transition: 0.2s;
            }

            .modal-header .close:hover {
            opacity: 1;
            }

            .modal-title {
            font-weight: 700;
            font-size: 1.2rem;
            }

            .form-control, .form-select {
            border: 2px solid #ddd;
            border-radius: 0.7rem;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            }

            .form-control:focus, .form-select:focus {
            border-color: #8b0000;
            box-shadow: 0 0 0 0.25rem rgba(139, 0, 0, 0.15);
            }

            input[type="number"]#nota {
            font-size: 1.1rem;
            font-weight: 600;
            }

            #comentario {
            border: 2px solid #ddd;
            border-radius: 0.7rem;
            padding: 0.8rem;
            font-size: 0.95rem;
            resize: vertical;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            }

            #comentario:focus {
            border-color: #8b0000;
            box-shadow: 0 0 0 0.25rem rgba(139, 0, 0, 0.15);
            outline: none;
            }

            .modal-footer {
            background-color: #f8f9fa;
            border-top: 1px solid #eee;
            border-radius: 0 0 1.5rem 1.5rem;
            }

            .btn-secondary {
            border-radius: 0.7rem;
            border: 2px solid #ddd;
            background-color: white;
            color: #333;
            font-weight: 600;
            transition: all 0.3s ease;
            }

            .btn-secondary:hover {
            background-color: #f0f0f0;
            border-color: #999;
            }

            .btn-primary {
            background: linear-gradient(135deg, #8b0000, #ce0a00);
            border: none;
            border-radius: 0.7rem;
            font-weight: 600;
            transition: all 0.3s ease;
            padding: 0.8rem 1.5rem;
            }

            .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(139, 0, 0, 0.3);
            background: linear-gradient(135deg, #ce0a00, #8b0000);
            }

            label {
            font-weight: 600;
            color: #2b0000;
            margin-bottom: 0.5rem;
            display: block;
            }

            #resultado {
            font-weight: 600;
            color: #2b0000;
            animation: fadeInOut 0.3s ease-in;
            }

            @keyframes fadeInOut {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 1; }
            }
</style>
</head>
<body>

<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card w-100" style="max-width: 500px;">
        <h3 class="text-center mb-4">Minhas Corridas</h3>
        <div class="text-center mb-3">
            <a href="../caronas/gerenciar.html" class="btn btn-primary">Ver minhas Caronas</a>
        </div>
        <div id="corridas-lista" class="mb-3">

</div>

<!-- Modal -->
<div class="modal fade" id="modalAvaliacao" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Realizar a avaliação dos usuários da corrida </h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
                        <select class="form-select form-control" aria-label="Selecione o participante" id="id_user">
                </select>
                        <div class="mt-1"> <label for="nota">Digite a nota:</label></div>
                      <div class=""> <input type="number" id="nota" placeholder="0-5" min="0" max="5"></div>
                      <div class="mt-3"> <label for="comentario">Observação (opcional):</label></div>
                      <div class=""> <textarea id="comentario" class="form-control" placeholder="Deixe uma observação..." rows="3"></textarea></div>
      </div>
      <div class="modal-footer">
        <small id="resultado" style="position: relative; right: 2vw;"></small>
        <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" onclick="enviarAvaliacao()">Concluir avaliação</button>
      </div>
    </div>
  </div>
</div>

    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>

    <script>
const dormir = (ms) => new Promise(resolve => setTimeout(resolve, ms));
       document.addEventListener("DOMContentLoaded", (event) => {
    const nome = sessionStorage.getItem('nome');
    const cargo = sessionStorage.getItem('cargo');
    const status = sessionStorage.getItem('status');
    const bemvindo = document.getElementById('bem-vindo');
    if (cargo !== 'motorista' && cargo !== 'admin') {
        window.location.href = '../usuario/login.html';
    }else {
        bemvindo.textContent = `Seja bem-vindo ${nome}`;
    }
    receber();
});



 async function receber(){
            try {
            id_motorista = sessionStorage.getItem('id');
            let requisicao = await fetch(`../../api/corridas.php?id_motorista=${id_motorista}` , {
                method: 'GET',
                headers:{
                    'Content-Type': 'application/json'
                }
            })
            
        const resposta = await requisicao.json(); 
        console.log("Resposta:", resposta);
        
        const lista = document.getElementById('corridas-lista');
        lista.innerHTML = ""; 
        let contador = 0;
        resposta.forEach(corrida => {

                const labels = {
        'pendente':     'Pendente',
        'em_andamento': 'Em andamento',
        'finalizada':   'Finalizada',
        'cancelada':    'Cancelada'
    };
    const ap = labels[corrida.status] || corrida.status;
    const botoes = corrida.status === 'pendente' ? `
        <a href="#" class="btn btn-outline-primary btn-sm ml-2" onclick="atualizarStatus(${corrida.id_carona},'em_andamento')">Iniciar</a>
        <a href="#" class="btn btn-outline-danger btn-sm ml-2" onclick="atualizarStatus(${corrida.id_carona},'cancelada')">Cancelar</a>
    ` : corrida.status === 'em_andamento' ? `
        <a href="#" class="btn btn-outline-info btn-sm ml-2" onclick="atualizarStatus(${corrida.id_carona},'finalizada')">Finalizar</a>
        <a href="#" class="btn btn-outline-danger btn-sm ml-2" onclick="atualizarStatus(${corrida.id_carona},'cancelada')">Cancelar</a>
    ` : corrida.status === 'finalizada' ? `
        <a href="#" class="btn btn-outline-warning btn-sm ml-2"  data-toggle="modal" onclick="abrirModal(${corrida.id_carona})">Avaliar</a>
    ` : '';

            lista.innerHTML += `
                <div class="card mb-2">
                    <div class="card-body">
                        <h5 class="card-title mb-1" style = "position: relative;
  bottom: 2.5vh;
  font-size: 1.3vw;
  right: 2vw;">Carona : ${corrida.titulo}</h5>
                        <p class="mb-1">Origem: <b>${corrida.origem}</b></p>
                        <p class="mb-1">Destino: <b>${corrida.destino}</b></p>
                        <p class="mb-1">Passageiros: <b>${corrida.passageiros}</b></p>
                        <span class="badge badge-primary">${ap} </span>
                        <div class="mt-4 d-flex justify-content-center align-items-center" id="btn-lista">
                     ${botoes}
                            </div>
                    </div>
                </div>
            `;
            contador +=1;

                       

        });





    } 
            catch (err) {
                console.log(err);
            }




}

async function atualizarStatus(id_carona,acao){
try{
    id_motorista = sessionStorage.getItem('id');
    let requisicao = await fetch(`../../api/corridas.php?id_carona=${id_carona}&id_motorista=${id_motorista}` , {
        method: 'POST',
        headers:{
            'Content-Type': 'application/json'
        },
        body : JSON.stringify({status: acao})
                })

                 const resposta = await requisicao.json(); 
        console.log("Resposta:", resposta);
        lista = document.getElementById('corridas-lista');
        lista.innerHTML = "";
        receber();        
}
catch(err){
    console.log("erro é:" + err);
    alert(err);
}
}
    // <a href="#" class="ml-2  btn btn-outline-primary" onclick="atualizarStatus(${corrida.id_carona},'em_andamento')" id="iniciar">Iniciar</a>
    //                     <a href="#" class="ml-2 mr-2 btn btn-outline-info" onclick="atualizarStatus(${corrida.id_carona},'finalizada')" id="finalizar">Finalizar</a>
    //                     <a href="#" class="ml-2 btn btn-outline-danger" onclick="atualizarStatus(${corrida.id_carona},'cancelada')" id="cancelar">Cancelar</a>
                    


let id_carona_atual;

    async function abrirModal(id_carona){
        id_carona_atual = id_carona;
        const id_motorista=sessionStorage.getItem('id');
        const req = await fetch(`../../api/avaliacoes.php?id_carona=${id_carona}&id_motorista=${id_motorista}&tipo=motorista_para_passageiro`);
        const passageiros = await req.json();
        const select = document.getElementById('id_user');
        select.innerHTML = '<option selected disabled>Selecione o participante</option>';
         if (passageiros.length === 0) {
        select.innerHTML += '<option disabled>Todos já foram avaliados!</option>';
    } else {
        passageiros.forEach(p => {
            select.innerHTML += `<option value="${p.id_passageiro}">${p.nome || p.id_passageiro}</option>`;
        });
    }
    $('#modalAvaliacao').modal('show');
    }

    async function enviarAvaliacao() {
    const id_passageiro = document.getElementById('id_user').value;
    const id_motorista = sessionStorage.getItem('id');
    notaSelecionada = document.getElementById('nota').value;
    const nota = notaSelecionada; // da lógica de estrelas
     console.log("id_passageiro:", id_passageiro);
    console.log("id_motorista:", id_motorista);
    console.log("nota:", nota);
    if (id_passageiro == "Selecione o participante" && !nota){
         document.getElementById('resultado').innerHTML="Selecione o participante e digite a nota.";     
        await dormir(1000);
         document.getElementById('resultado').innerHTML="";     
        
         return;
        }
    
    else if (id_passageiro == "Selecione o participante")  {
        document.getElementById('resultado').innerHTML="Selecione um participante!!";
        await dormir(1000);
         document.getElementById('resultado').innerHTML="";     
  
        return;
    }

    else if (!nota) { 
        document.getElementById('resultado').innerHTML="Digite uma nota!!";
        await dormir(1000);
         document.getElementById('resultado').innerHTML="";     
  
        return;
    }
    else if (nota < 0 || nota > 5){
        document.getElementById('resultado').innerHTML="Nota inválida!!";
        await dormir(1000);
         document.getElementById('resultado').innerHTML="";  
         return;
    }

    const comentario = document.getElementById('comentario').value || '';
    const req = await fetch(
        `../../api/avaliacoes.php?id_passageiro=${id_passageiro}&id_motorista=${id_motorista}`,
        {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ nota, tipo: 'motorista_para_passageiro', comentario })
        }
    );
    const resposta = await req.json();
    console.log(resposta.message);
    if (resposta.message) {
        document.getElementById('nota').value = ''
        document.getElementById('comentario').value = ''
        document.getElementById('resultado').innerHTML = 'Avaliação enviada!';
        await dormir(1000);
        document.getElementById('resultado').innerHTML = '';   
        $('#modalAvaliacao').modal('hide');
        receber();
    }
}
    </script>
<script src="../timeout/session-timeout.js"></script>
