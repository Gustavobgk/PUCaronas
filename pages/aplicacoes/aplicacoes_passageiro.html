    <script>
       document.addEventListener("DOMContentLoaded", (event) => {
    const bemvindo = document.getElementById('bem-vindo');
    const nome = sessionStorage.getItem('nome');
    const cargo = sessionStorage.getItem('cargo');
    const status = sessionStorage.getItem('status');
    if (cargo !== 'passageiro' && cargo !== 'admin') {
        window.location.href = '../usuario/login.html';
    } else{
        bemvindo.textContent = `Seja bem-vindo ${nome}`;
    }
    receber();
});



 async function receber(){
            try {
            id_passageiro = sessionStorage.getItem('id');
            let requisicao = await fetch(`../../api/aplicacoes.php?id_passageiro=${id_passageiro}` , {
                method: 'GET',
                headers:{
                    'Content-Type': 'application/json'
                }
            })
            
        const resposta = await requisicao.json(); 
        console.log("Resposta:", resposta);
        
        const lista = document.getElementById('aplicacoes-lista');
        lista.innerHTML = ""; 
        let contador = 0;
        resposta.forEach(aplicacao => {
        
        if (aplicacao.status = "pendente"){
            ap = "Pendente"; 
        }
        else if (aplicacao.status = "aprovado"){
            ap = "Aprovado"; 
        }
        else if (aplicacao.status = "recusado"){
            ap = "Recusado"; 
            b = `        <a href="#" class="btn btn-outline-warning btn-sm ml-2" onclick="avaliar(${aplicacao.id_motorista})">Avaliar</a>
` 
        }
        
            lista.innerHTML += `
                <div class="card mb-2">
                    <div class="card-body">
                        <h5 class="card-title mb-1" style = "position: relative;
                        bottom: 2.5vh;
                        font-size: 1.3vw;
                        right: 2vw;">Carona : ${aplicacao.titulo}</h5>
                        <h5 class="card-subtitle mb-1">Status : ${ap}</h5>
                        <p class="mb-1">Origem: <b>${aplicacao.origem}</b></p>
                        <p class="mb-1">Destino: <b>${aplicacao.destino}</b></p>
                        <span class="badge badge-primary">${aplicacao.vagas} vagas disponíveis</span>
                    </div>
                </div>
            `;
            contador +=1;
        });





    } 
            catch (err) {
                console.log(err);
            }




}

    </script>
